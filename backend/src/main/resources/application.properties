spring.config.import=optional:file:.env[.properties]
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/luxury_gift_hampers}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations (Automatically update schema for new entities without dropping existing tables)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (256-bit secure secret key)
hamperly.app.jwtSecret=${JWT_SECRET:4a2d8e9c1b3f7a5c8e2d1f9b3c7e5a2d8e9c1b3f7a5c8e2d1f9b3c7e5a2d8e9c}
hamperly.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Mail Server Configurations
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Reset Password URL
app.reset-password.url=http://localhost:5173/reset-password

# Server Port Configuration (dynamic port mapped by Render, defaults to 8080 locally)
server.port=${PORT:8080}

# Razorpay Configuration (falls back to empty string if not configured in Render)
RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:}
RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:}

